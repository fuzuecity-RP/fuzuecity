<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Fuzuê City RP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* FUNDO DO SITE */
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(30, 64, 255, 0.35), transparent 60%),
        linear-gradient(180deg, #02040f 0%, #050b2e 50%, #02040f 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* TEXTO GIGANTE NO FUNDO */
    body::before {
      content: "FUZUÊ CITY";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20vw;
      font-weight: 900;
      letter-spacing: 14px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.03);
      transform: rotate(-8deg);
      user-select: none;
      pointer-events: none;
    }

    /* CARD (TEMPORÁRIO, SÓ PRA VER O FUNDO FUNCIONANDO) */
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Fuzuê City RP</h1>
  </div>

</body>
</html>
