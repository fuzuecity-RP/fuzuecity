<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Fuzuê City RP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #0a0a0a, #111827);
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container {
      max-width: 420px;
      padding: 30px;
      background: rgba(0,0,0,0.45);
      border-radius: 14px;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
    }

    h1 {
      margin-bottom: 10px;
      font-size: 28px;
    }

    p {
      color: #d1d5db;
      margin: 8px 0;
    }

    .badge {
      margin-top: 15px;
      font-size: 14px;
      color: #9ca3af;
    }

    .btn {
      display: inline-block;
      margin-top: 22px;
      padding: 14px 26px;
      background: #5865F2;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      background: #4752c4;
      transform: scale(1.05);
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🔥 FUZUÊ CITY RP 🔥</h1>

    <p>Servidor RP ativo dentro e fora do jogo.</p>
    <p>Staff online • Suporte 24h • Comunidade ativa</p>

    <a class="btn" href="https://discord.gg/7yUGMapanD" target="_blank">
      🚪 Entrar no Discord
    </a>

    <div class="badge">
      © Fuzuê City RP • Todos os direitos reservados
    </div>
  </div>
</body>
</html>
