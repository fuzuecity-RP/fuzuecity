<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Fuzuê City RP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FONTE PREMIUM -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* FUNDO DO SITE */
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(30, 64, 255, 0.4), transparent 60%),
        linear-gradient(180deg, #02040f 0%, #050b2e 50%, #02040f 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      font-family: 'Orbitron', sans-serif;
    }

    /* TEXTO GIGANTE NO FUNDO */
    body::before {
      content: "FUZUÊ CITY ⛲";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 20vw;
      font-weight: 900;
      letter-spacing: 18px;
      text-transform: uppercase;

      /* TEXTO PREMIUM */
      background: linear-gradient(
        120deg,
        rgba(255,255,255,0.08),
        rgba(0,120,255,0.18),
        rgba(255,255,255,0.05)
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      /* BRILHO + PROFUNDIDADE */
      text-shadow:
        0 0 40px rgba(0, 120, 255, 0.35),
        0 0 80px rgba(0, 90, 255, 0.15);

      transform: rotate(-8deg);
      opacity: 0.9;

      user-select: none;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <!-- Apenas o fundo cinematográfico -->
</body>
</html>
