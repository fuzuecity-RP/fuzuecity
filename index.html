<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Fuzuê City RP</title>

  <style>
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Arial', sans-serif;
    }

    /* FUNDO GERAL */
    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #0a1cff, #02040f);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* TEXTO GIGANTE NO FUNDO */
    body::before {
      content: "FUZUÊ CITY";
      position: absolute;
      font-size: 18vw;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.04);
      letter-spacing: 12px;
      text-transform: uppercase;
      white-space: nowrap;
      transform: rotate(-8deg);
      user-select: none;
    }

    /* CARD CENTRAL */
    .container {
      background: rgba(10, 20, 60, 0.75);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 0 60px rgba(0, 100, 255, 0.4);
      position: relative;
      z-index: 1;
    }

    /* TITULO */
    .container h1 {
      font-size: 28px;
      margin-bottom: 12px;
      text-shadow: 0 0 12px rgba(0, 140, 255, 0.8);
    }

    /* DESCRIÇÃO */
    .container p {
      font-size: 15px;
      opacity: 0.9;
      margin-bottom: 8px;
    }

    /* BOTÃO DISCORD */
    .container a {
      display: inline-block;
      margin-top: 18px;
      padding: 14px 26px;
      background: linear-gradient(135deg, #3b6cff, #00b3ff);
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 0 25px rgba(0, 140, 255, 0.7);
      transition: all 0.3s ease;
    }

    /* HOVER BOTÃO */
    .container a:hover {
      transform: scale(1.07);
      box-shadow: 0 0 40px rgba(0, 170, 255, 1);
    }

    /* RODAPÉ */
    .footer {
      margin-top: 18px;
      font-size: 12px;
      opacity: 0.6;
    }
  </style>

</head>
<body>

  <div class="container">
    <h1>🔥 FUZUÊ CITY RP 🔥</h1>
    <p>Servidor RP ativo dentro e fora do jogo.</p>
    <p>Staff online • Suporte 24h • Comunidade ativa</p>

    <a href="https://discord.gg/seulink" target="_blank">
      🚪 Entrar no Discord
    </a>

    <div class="footer">
      © Fuzuê City RP • Todos os direitos reservados
    </div>
  </div>

</body>
</html>
